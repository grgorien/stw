name: stw Release Steps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GTK4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - name: Build relase binary
        run: make release

      - name: Set version and strip v
        id: version
        run: echo "ver=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Package up
        run: |
          PKGDIR=stw-${{ steps.version.outputs.ver }}-linux-x86_64
          mkdir -p "$PKGDIR"
          cp stw "$PKGDIR/"
          cp data/stw.desktop "$PKGDIR/"
          cp data/stw.svg "$PKGDIR/"

          # install script for non-developer users
          cat > "$PKGDIR/install.sh" << 'EOF'
          #!/bin/sh
          set -e
          BINDIR="${PREFIX:-/usr/local}/bin"
          APPDIR="${PREFIX:-/usr/local}/share/applications"
          ICONDIR="${PREFIX:-/usr/local}/share/icons/hicolor/scalable/apps"
          install -Dm755 stw            "$BINDIR/stw"
          install -Dm644 stw.desktop    "$APPDIR/stw.desktop"
          install -Dm644 stw.svg        "$ICONDIR/stw.svg"
          echo "status: installed.\n Run 'stw' or find it in your app menu."
          EOF
          chmod +x "$PKGDIR/install.sh"

          tar -czf "$PKGDIR.tar.gz" "$PKGDIR"

      - name: Release create and tarball attach
        uses: ncipollo/release-action@v1
        with:
          name: "stw ${{ steps.version.outputs.ver }}"
          generate_release_notes: true
          files: stw-${{ steps.version.outputs.ver }}-linux-x86_64.tar.gz
